---
- hosts: localhost
  connection: local
  gather_facts: false
  vars:
    jenkins_host: 'https://jenkins-foreman.apps.ocp.cloud.ci.centos.org/'
  tasks:
    - name: Cancel this dispatch and wait for the child's cleanup
      konflux_gate_cancel:
        url: "{{ jenkins_host }}"
        url_username: "{{ jenkins_username }}"
        url_password: "{{ jenkins_password }}"
        job: "{{ jenkins_job_name }}"
        request_id: "{{ jenkins_gate_request_id }}"
      register: child_cleanup

    - name: Record the recovered child URL for the parent build link
      copy:
        dest: "{{ jenkins_job_link_file }}"
        content: "{{ child_cleanup.builds[0].url }}"
      when: child_cleanup.builds | length > 0
